<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invoice Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand:    #2563eb;
    --brand-lt: #dbeafe;
    --dark:     #0f172a;
    --mid:      #1e293b;
    --muted:    #64748b;
    --light:    #f8fafc;
    --border:   #e2e8f0;
    --radius:   14px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--light);
    color: var(--dark);
    line-height: 1.5;
  }

  /* ── Toolbar (screen only) ── */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0.85rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  }
  .toolbar a.back {
    color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 600;
  }
  .toolbar a.back:hover { color: var(--brand); }
  .toolbar-btns { display: flex; align-items: center; gap: 0.6rem; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.82rem; font-weight: 700; padding: 8px 16px;
    border-radius: 99px; border: 1.5px solid var(--brand);
    cursor: pointer; transition: all .15s; background: #fff; color: var(--brand);
  }
  .btn:hover { background: var(--brand); color: #fff; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-ghost { border-color: var(--border); color: var(--muted); }
  .btn-ghost:hover { background: var(--light); color: var(--dark); border-color: var(--border); }

  .lang-toggle {
    display: flex; align-items: center;
    background: var(--light); border: 1.5px solid var(--border);
    border-radius: 99px; padding: 3px; gap: 2px;
  }
  .lang-btn {
    font-size: .75rem; font-weight: 700; padding: 4px 12px;
    border-radius: 99px; border: none; cursor: pointer;
    transition: all .2s; background: transparent; color: var(--muted);
  }
  .lang-btn.active { background: var(--brand); color: #fff; }

  /* ── Sheet ── */
  .sheet-wrap { max-width: 850px; margin: 2rem auto 4rem; padding: 0 1rem; }
  .sheet {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 3rem; box-shadow: 0 4px 24px rgba(15,23,42,.06);
  }

  input, textarea, select {
    font-family: inherit; font-size: inherit; color: inherit;
    border: 1px solid transparent; border-radius: 6px; background: transparent;
    padding: 3px 6px; width: 100%;
  }
  input:hover, textarea:hover, select:hover { border-color: var(--border); background: var(--light); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--brand); background: #fff; }
  textarea { resize: vertical; min-height: 60px; }
  textarea.desc-input { resize: none; min-height: 26px; line-height: 1.45; overflow: hidden; font-size: 0.8rem; }
  .desc-print { display: none; }

  .sheet-top { display: flex; justify-content: space-between; gap: 2rem; margin-bottom: 1.25rem; }
  .sheet-top-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.85rem; }
  .from-block .biz-name { font-size: 0.95rem; font-weight: 600; font-style: normal; color: var(--brand); padding-left: 0; }
  .from-block .line { line-height: 1.25; }
  .from-block .line input { font-size: 0.8rem; font-weight: 400; font-style: normal; color: var(--muted); padding-left: 0; }
  .from-block .line.taxid { display: flex; align-items: center; gap: 4px; }
  .from-block .line.taxid .taxid-lbl { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .from-block .line.taxid input { width: auto; flex: 1; min-width: 0; }
  .contact-line { display: flex; align-items: center; gap: 6px; }
  .contact-line input { width: auto; flex: 1; min-width: 0; }
  .contact-line .sep { color: var(--border); flex-shrink: 0; }

  .signature { display: flex; justify-content: flex-end; margin-top: 2.5rem; }
  .signature-box { text-align: center; min-width: 240px; }
  .sig-canvas {
    display: block; width: 220px; height: 80px; margin: 0 auto;
    border: 1px dashed var(--border); border-radius: 6px; background: #fff;
    cursor: crosshair; touch-action: none;
  }
  .signature-underline { border-top: 1.5px solid var(--dark); margin-top: 6px; width: 220px; margin-left: auto; margin-right: auto; }
  .signature-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 6px; }
  .signature-lbl { font-size: 0.78rem; color: var(--muted); }
  .sig-clear-btn {
    font-size: 0.68rem; font-weight: 700; color: var(--muted);
    background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0;
  }
  .sig-clear-btn:hover { color: #dc2626; }

  .quote-meta {
    text-align: right; min-width: 220px; flex-shrink: 0;
    background: var(--light); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
  }
  .quote-meta h1 { font-size: 1.4rem; letter-spacing: 1px; color: var(--dark); margin-bottom: 0.75rem; }
  .meta-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 0.8rem; margin-bottom: 6px; }
  .meta-row label { color: var(--muted); white-space: nowrap; }
  .meta-row input { text-align: right; max-width: 140px; }

  .attn-line { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
  .attn-lbl { font-size: 0.85rem; color: var(--dark); font-weight: 400; font-style: normal; white-space: nowrap; }
  .attn-input { font-size: 0.85rem; font-weight: 400; font-style: normal; padding-left: 4px; }

  .intro-sentence { font-size: 0.82rem; color: var(--muted); line-height: 1.5; margin-bottom: 1.25rem; }

  .terms-extra { font-size: 0.75rem; color: var(--muted); line-height: 1.7; }
  .terms-extra .line { display: flex; align-items: center; gap: 6px; }
  .terms-extra label { white-space: nowrap; }
  .terms-extra input { max-width: 120px; }

  .baht-words { text-align: center; font-size: 0.85rem; font-style: italic; color: var(--dark); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }

  .status-badge { display: flex; justify-content: flex-end; margin-bottom: 0.75rem; }
  .status-badge select {
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
    text-align: center; border-radius: 99px; padding: 5px 14px; cursor: pointer;
    border: 1.5px solid; width: auto;
  }
  .status-badge select.unpaid { color: #b45309; background: #fef3c7; border-color: #fcd34d; }
  .status-badge select.paid   { color: #15803d; background: #dcfce7; border-color: #86efac; }
  .status-badge select.overdue{ color: #b91c1c; background: #fee2e2; border-color: #fca5a5; }

  .bill-to { padding-top: 0.6rem; border-top: 1px dashed var(--border); line-height: 1.15; }
  .bill-to .section-lbl { font-size: 0.85rem; font-weight: 800; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 0.3rem; }
  .bill-to input { font-size: 0.8rem; font-weight: 400; font-style: normal; color: var(--muted); padding-left: 0; margin-bottom: 0; }
  .bill-to input.client-name { font-weight: 600; font-size: 0.85rem; color: var(--dark); }

  table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; font-size: 0.8rem; border: 1px solid var(--dark); }
  thead th {
    text-align: left; vertical-align: top; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.5px;
    color: var(--muted); text-transform: uppercase; padding: 8px 6px;
    border: 1px solid var(--dark);
  }
  thead th.num, thead th.amt { text-align: center; }
  thead th.rownum { text-align: center; }
  tbody td { padding: 6px; border: 1px solid var(--border); vertical-align: top; }
  tbody td.num, tbody td.amt { text-align: center; white-space: nowrap; }
  tbody td.num input, tbody td.amt input { text-align: center !important; }
  tbody td.rownum { text-align: center; padding-top: 9px; }
  tbody td.amt-val { font-weight: 600; padding-top: 9px; }
  .row-del {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 1rem; padding: 4px; line-height: 1;
  }
  .row-del:hover { color: #dc2626; }

  .add-row-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.8rem; font-weight: 700; color: var(--brand);
    background: var(--brand-lt); border: none; border-radius: 8px;
    padding: 7px 14px; cursor: pointer; margin-bottom: 2rem;
  }
  .add-row-btn:hover { background: #bfdbfe; }

  .totals { display: flex; justify-content: space-between; align-items: flex-end; gap: 1.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .totals-box { min-width: 240px; border: 1px solid var(--dark); padding: 0.5rem 0.75rem; }
  .totals-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; font-size: 0.78rem; }
  .totals-row label { color: var(--muted); }
  .totals-row input.pct { max-width: 45px; text-align: right; font-size: 0.78rem; padding: 2px 4px; }
  .totals-row .val { font-weight: 600; min-width: 75px; text-align: right; }
  .totals-row.grand { border-top: 1.5px solid var(--dark); margin-top: 4px; padding-top: 6px; font-size: 0.95rem; }
  .totals-row.grand label { color: var(--dark); font-weight: 800; }
  .totals-row.grand .val { font-weight: 800; color: var(--brand); }

  .notes .section-lbl { font-size: 0.72rem; font-weight: 800; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 0.5rem; }
  .notes textarea { font-size: 0.85rem; padding-left: 0; }

  .sheet-footer { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); text-align: center; font-size: 0.78rem; color: var(--muted); }

  @media print {
    html { font-size: 13px; }
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet-wrap { margin: 0; padding: 0; max-width: none; }
    .sheet { border: none; box-shadow: none; border-radius: 0; padding: 0.15in; }
    .row-del, .add-row-btn { display: none !important; }
    .delcol { display: none !important; }
    input:hover, textarea:hover, input:focus, textarea:focus { border-color: transparent; background: transparent; }
    input, textarea { border-color: transparent !important; }
    .status-badge select { border-width: 1.5px !important; -webkit-appearance: none; appearance: none; }
    .sig-canvas { border-color: transparent !important; }
    .sig-clear-btn { display: none !important; }

    /* Textareas can't be trusted to auto-size correctly across the
       screen->print font-size change — swap to a plain block element
       that always sizes exactly to its content, at any font size. */
    textarea.desc-input { display: none !important; }
    .desc-print { display: block !important; white-space: pre-wrap; font-size: 0.8rem; line-height: 1.3; }

    .sheet-top { margin-bottom: 0.4rem; }
    .sheet-top-left { gap: 0.3rem; }
    .from-block .biz-name { font-size: 0.85rem; }
    .from-block .line { line-height: 1.05; }
    .from-block .line.taxid { margin-top: 1px; }
    .bill-to { padding-top: 0.25rem; }
    .bill-to .section-lbl { margin-bottom: 0.15rem; }
    .bill-to input { font-size: 0.75rem; }
    .bill-to input.client-name { font-size: 0.8rem; }
    .quote-meta { padding: 0.45rem 0.7rem; }
    .quote-meta h1 { font-size: 1rem; margin-bottom: 0.25rem; }
    .meta-row { margin-bottom: 2px; font-size: 0.72rem; }
    .status-badge { margin-bottom: 0.4rem; }
    .intro-sentence { margin-bottom: 0.6rem; }
    table { margin-bottom: 0.6rem; }
    textarea.desc-input { line-height: 1.3; }
    .totals { margin-bottom: 0.6rem; }
    .notes textarea { min-height: 32px; }
    .signature { margin-top: 0.8rem; }
    .sig-canvas { height: 55px; }
    .sheet-footer { margin-top: 1rem; padding-top: 0.6rem; }

    @page { margin: 0.3in; }
  }

  @media (max-width: 640px) {
    .sheet { padding: 1.5rem; }
    .sheet-top { flex-direction: column; gap: 1.5rem; }
    .quote-meta { text-align: left; }
    .meta-row { justify-content: space-between; }
    .meta-row input { text-align: left; }
    .status-badge { justify-content: flex-start; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <a class="back" href="index.html" data-i18n="back">← Back to Portfolio</a>
  <div class="toolbar-btns">
    <div class="lang-toggle">
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn active" onclick="setLang('th')">TH</button>
    </div>
    <button class="btn btn-ghost" onclick="addRow()" data-i18n="addItemBtn">+ Add Item</button>
    <button class="btn btn-primary" onclick="window.print()" data-i18n="printBtn">🖨️ Print / Save PDF</button>
  </div>
</div>

<div class="sheet-wrap">
  <div class="sheet" id="sheet">

    <div class="sheet-top">
      <div class="sheet-top-left">
        <div class="from-block">
          <input class="biz-name" id="fromName" value="Athipat Chumnanapa" />
          <div class="line"><input value="Web Developer — React / Node.js" /></div>
          <div class="line"><input id="fromAddress" value="78 Moo 5, Maesai, Mueang Phayao 56000" /></div>
          <div class="line contact-line"><input value="085-107-7620" /><span class="sep">·</span><input value="athipaty@gmail.com" /></div>
          <div class="line taxid"><span class="taxid-lbl" data-i18n="taxIdLbl">Tax ID:</span><input class="taxid-input" value="1199700063809" /></div>
        </div>

        <div class="bill-to">
          <div class="section-lbl" data-i18n="billTo">Bill To</div>
          <input class="client-name" value="องค์การบริหารส่วนตำบลแม่ใส" />
          <input value="198 ม.12 ตำบลแม่ใส อำเภอเมืองพะเยา จังหวัดพะเยา 56000" />
          <div class="contact-line"><input value="054-889-909" /><span class="sep">·</span><input value="saraban_06560115@dla.go.th" /></div>
        </div>
      </div>

      <div class="quote-meta">
        <h1 data-i18n="title">INVOICE</h1>
        <div class="status-badge">
          <select id="statusSel" class="unpaid" onchange="this.className=this.value">
            <option value="unpaid" data-i18n-opt="stUnpaid" selected>Unpaid</option>
            <option value="paid" data-i18n-opt="stPaid">Paid</option>
            <option value="overdue" data-i18n-opt="stOverdue">Overdue</option>
          </select>
        </div>
        <div class="meta-row"><label data-i18n="noLbl">Invoice #</label><input id="quoteNo" value="INV-0001" /></div>
        <div class="meta-row"><label data-i18n="dateLbl">Date</label><input id="quoteDate" type="date" /></div>
        <div class="meta-row"><label data-i18n="validLbl">Due Date</label><input id="quoteValid" type="date" /></div>
      </div>
    </div>

    <p class="intro-sentence" id="introSentence" data-i18n="introSentence">I am pleased to invoice for the goods/services below, per the price and terms stated in this document.</p>

    <table>
      <thead>
        <tr>
          <th class="rownum" style="width:44px">#</th>
          <th data-i18n="thDesc">Description</th>
          <th class="num" style="width:70px" data-i18n="thQty">Qty</th>
          <th class="amt" style="width:110px" data-i18n="thPrice">Unit Price (฿)</th>
          <th class="amt" style="width:110px" data-i18n="thAmt">Amount (฿)</th>
          <th class="delcol" style="width:30px"></th>
        </tr>
      </thead>
      <tbody id="itemRows"></tbody>
    </table>

    <button class="add-row-btn" onclick="addRow()" data-i18n="addLineBtn">+ Add Line Item</button>

    <div class="totals">
      <div class="terms-extra">
        <div class="line"><label data-i18n="warrantyLbl">Warranty:</label><input id="warrantyTerm" value="365 days" /></div>
        <div class="line"><label data-i18n="creditLbl">Credit:</label><input id="creditTerm" value="30 days" /></div>
      </div>
      <div class="totals-box">
        <div class="totals-row">
          <label data-i18n="subtotal">Subtotal</label>
          <div class="val" id="subtotalVal">฿0.00</div>
        </div>
        <div class="totals-row">
          <label data-i18n="discount">Discount (%)</label>
          <input class="pct" id="discountPct" type="number" value="0" min="0" step="0.01" oninput="recalc()" />
        </div>
        <div class="totals-row">
          <label data-i18n="afterDiscount">Amount Before VAT</label>
          <div class="val" id="afterDiscountVal">฿0.00</div>
        </div>
        <div class="totals-row">
          <label data-i18n="tax">Tax / VAT (%)</label>
          <input class="pct" id="taxPct" type="number" value="0" min="0" step="0.01" oninput="recalc()" />
        </div>
        <div class="totals-row">
          <label data-i18n="vatAmount">VAT Amount</label>
          <div class="val" id="vatAmountVal">฿0.00</div>
        </div>
        <div class="totals-row grand">
          <label data-i18n="total">Total Due</label>
          <div class="val" id="totalVal">฿0.00</div>
        </div>
        <div class="baht-words" id="bahtWords">( — )</div>
      </div>
    </div>

    <div class="notes">
      <div class="section-lbl" data-i18n="notesLbl">Notes / Payment Details</div>
      <textarea>Please make payment by the due date above. Bank transfer details available on request.</textarea>
    </div>

    <div class="signature">
      <div class="signature-box">
        <canvas id="sigCanvas" class="sig-canvas" width="440" height="160"></canvas>
        <div class="signature-underline"></div>
        <div class="signature-row">
          <div class="signature-lbl" data-i18n="sigLbl">Authorized by</div>
          <button type="button" class="sig-clear-btn" onclick="sigPad.clear()" data-i18n="sigClear">Clear</button>
        </div>
      </div>
    </div>

    <div class="sheet-footer" data-i18n="footer">Thank you for your business.</div>
  </div>
</div>

<script>
  function todayISO(offsetDays = 0) {
    const d = new Date();
    d.setDate(d.getDate() + offsetDays);
    return d.toISOString().slice(0, 10);
  }
  document.getElementById('quoteDate').value = todayISO();
  document.getElementById('quoteValid').value = todayISO(14);

  const fmt = n => '฿' + (isNaN(n) ? 0 : n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function syncDescPrint(el) {
    const div = el.parentElement.querySelector('.desc-print');
    if (div) div.textContent = el.value;
  }

  function rowTemplate(n, desc = '', qty = 1, price = 0) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rownum">${n}</td>
      <td><textarea class="desc-input" rows="1" oninput="recalc(); autoResize(this); syncDescPrint(this)">${desc}</textarea><div class="desc-print"></div></td>
      <td class="num"><input class="qty" type="number" value="${qty}" min="0" step="1" style="text-align:right" oninput="recalc()" /></td>
      <td class="amt"><input class="price" type="number" value="${price}" min="0" step="0.01" style="text-align:right" oninput="recalc()" /></td>
      <td class="amt amt-val">฿0.00</td>
      <td class="delcol"><button class="row-del" onclick="delRow(this)" title="Remove item">✕</button></td>
    `;
    const descEl = tr.querySelector('.desc-input');
    if (!desc) descEl.placeholder = I18N[currentLang].descPh;
    syncDescPrint(descEl);
    return tr;
  }

  function addRow(desc = '', qty = 1, price = 0) {
    const tbody = document.getElementById('itemRows');
    const tr = rowTemplate(tbody.children.length + 1, desc, qty, price);
    tbody.appendChild(tr);
    autoResize(tr.querySelector('.desc-input'));
    recalc();
  }

  function delRow(btn) {
    btn.closest('tr').remove();
    renumberRows();
    recalc();
  }

  function renumberRows() {
    document.querySelectorAll('#itemRows tr').forEach((tr, i) => {
      tr.querySelector('td.rownum').textContent = i + 1;
    });
  }

  function recalc() {
    let subtotal = 0;
    document.querySelectorAll('#itemRows tr').forEach(tr => {
      const qty   = parseFloat(tr.querySelector('.qty').value) || 0;
      const price = parseFloat(tr.querySelector('.price').value) || 0;
      const amt   = qty * price;
      tr.querySelector('.amt-val').textContent = fmt(amt);
      subtotal += amt;
    });

    const discountPct = parseFloat(document.getElementById('discountPct').value) || 0;
    const taxPct      = parseFloat(document.getElementById('taxPct').value) || 0;
    const afterDiscount = subtotal * (1 - discountPct / 100);
    const vatAmount = afterDiscount * (taxPct / 100);
    const total = afterDiscount + vatAmount;

    document.getElementById('subtotalVal').textContent = fmt(subtotal);
    document.getElementById('afterDiscountVal').textContent = fmt(afterDiscount);
    document.getElementById('vatAmountVal').textContent = fmt(vatAmount);
    document.getElementById('totalVal').textContent = fmt(total);
    document.getElementById('bahtWords').textContent = '( ' + thaiBahtText(total) + ' )';
  }

  // ── Thai baht-in-words (matches the standard บาทถ้วน reading used on Thai
  // government/business documents) ──
  function thaiBahtText(amount) {
    const digits = ['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
    const places = ['','สิบ','ร้อย','พัน','หมื่น','แสน'];

    function convertGroup(numStr) {
      numStr = numStr.replace(/^0+/, '');
      if (!numStr) return '';
      let out = '';
      const len = numStr.length;
      for (let i = 0; i < len; i++) {
        const d = parseInt(numStr[i], 10);
        const pos = len - i - 1;
        if (d === 0) continue;
        if (pos === 0) {
          out += (d === 1 && len > 1) ? 'เอ็ด' : digits[d];
        } else if (pos === 1) {
          out += (d === 1) ? 'สิบ' : (d === 2) ? 'ยี่สิบ' : digits[d] + 'สิบ';
        } else {
          out += digits[d] + places[pos];
        }
      }
      return out;
    }

    function convertInteger(intStr) {
      intStr = intStr.replace(/^0+/, '') || '0';
      if (intStr === '0') return 'ศูนย์';
      const groups = [];
      let s = intStr;
      while (s.length > 0) { groups.unshift(s.slice(-6)); s = s.slice(0, -6); }
      let out = '';
      for (let i = 0; i < groups.length; i++) {
        const g = convertGroup(groups[i]);
        if (g) out += g + (i < groups.length - 1 ? 'ล้าน' : '');
      }
      return out;
    }

    amount = Math.round((amount || 0) * 100) / 100;
    const negative = amount < 0;
    amount = Math.abs(amount);
    const baht = Math.floor(amount);
    const satang = Math.round((amount - baht) * 100);

    let text = convertInteger(String(baht)) + 'บาท';
    text += satang > 0 ? convertGroup(String(satang).padStart(2, '0')) + 'สตางค์' : 'ถ้วน';
    return (negative ? 'ลบ' : '') + text;
  }

  // ── Signature pad — draw on mouse or touch, auto-saved to this browser so it
  // carries over between quotation.html and invoice.html without re-signing ──
  function setupSignaturePad(canvasId, storageKey) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let drawing = false, last = null;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height),
      };
    }
    function start(e) {
      drawing = true;
      last = getPos(e);
      canvas.setPointerCapture(e.pointerId);
    }
    function move(e) {
      if (!drawing) return;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      last = pos;
    }
    function end() {
      if (!drawing) return;
      drawing = false;
      try { localStorage.setItem(storageKey, canvas.toDataURL('image/png')); } catch {}
    }

    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointerleave', end);

    const saved = localStorage.getItem(storageKey);
    if (saved) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = saved;
    }

    return {
      clear() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        try { localStorage.removeItem(storageKey); } catch {}
      },
    };
  }
